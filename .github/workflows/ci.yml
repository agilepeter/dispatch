name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Check scripts are executable
        run: |
          test -x bin/dispatch-ledger
          test -x bin/dispatch-stats

      - name: Byte-compile scripts
        run: python3 -m py_compile bin/dispatch-ledger bin/dispatch-stats

      - name: Run tests
        run: pytest -q
