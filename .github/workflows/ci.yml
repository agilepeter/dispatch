name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest==9.1.1 pyyaml==6.0.3

      # test -x is a POSIX-ism; there is no equivalent execute-permission
      # bit to check on Windows, so this step is meaningless there rather
      # than failing for a real reason.
      - name: Check scripts are executable
        if: runner.os != 'Windows'
        run: |
          test -x bin/dispatch-ledger
          test -x bin/dispatch-stats
          test -x scripts/release-check.sh

      # python (not python3): actions/setup-python guarantees "python" on
      # every OS in the matrix; Windows runners do not reliably provide a
      # "python3" alias.
      - name: Byte-compile scripts
        run: python -m py_compile bin/dispatch-ledger bin/dispatch-stats

      - name: Run tests
        # -rs names every skipped test and its reason, so a green leg says exactly
        # which tests ran there without anyone decoding progress dots.
        run: pytest -q -rs

      # Runs on one leg only: what this validates (the manifest and every skill's
      # frontmatter) does not differ by OS, so three installs of the CLI would only
      # triple the network cost without checking anything new. pytest's own frontmatter
      # test parses the same YAML and catches the same syntax errors, but this step runs
      # the actual tool Claude Code loads a plugin with, not a stand-in for it, so it also
      # catches whatever else that tool checks beyond plain YAML validity.
      - name: Install Claude Code CLI
        if: matrix.os == 'ubuntu-latest'
        # Pinned like everything else here, so a validator change upstream arrives as a
        # deliberate bump in this file, never as an unexplained red run.
        run: npm install -g @anthropic-ai/claude-code@2.1.283

      - name: Validate the plugin manifest and marketplace entry
        if: matrix.os == 'ubuntu-latest'
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .
